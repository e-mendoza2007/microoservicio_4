openapi: 3.0.0
info:
  title: API de Perfil de Jugador
  description: Microservicio agregador (sin base de datos propia). Combina datos de Catálogo (MS1), Partidas (MS2) y Membresías (MS3) en una ficha consolidada del jugador.
  version: 1.0.0
servers:
  - url: http://localhost:8004
    description: Servidor de desarrollo
paths:
  /perfil/{nombre_jugador}:
    get:
      summary: Obtener ficha consolidada de un jugador
      description: Llama internamente a MS1, MS2 y MS3 para armar un perfil con membresía, reservas y partidas jugadas.
      parameters:
        - name: nombre_jugador
          in: path
          required: true
          schema:
            type: string
          example: Ana Torres
      responses:
        "200":
          description: Ficha consolidada del jugador
          content:
            application/json:
              schema:
                type: object
                properties:
                  jugador:
                    type: string
                    example: Ana Torres
                  membresia:
                    type: string
                    example: premium
                  reservas:
                    type: array
                    items:
                      type: object
                      properties:
                        mesa:
                          type: integer
                          example: 4
                        horario:
                          type: string
                          example: "2026-09-10 18:00"
                        estado:
                          type: string
                          example: confirmada
                  partidas:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          example: 1
                        juego_id:
                          type: integer
                          example: 5
                        fecha:
                          type: string
                          example: "2026-08-20"
                        resultado:
                          type: string
                          example: "ganó"
                        juego_nombre:
                          type: string
                          example: "Catan"
